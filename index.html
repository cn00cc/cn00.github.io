<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cn伺服器 - Minecraft 官方宣傳網站</title>
    <style>
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --discord: #5865F2;
            --bg-dark: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            line-height: 1.6;
            /* 加入細微的 Minecraft 方塊網格背景 */
            background-image: 
                linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* 頂部主視覺區塊 */
        header {
            background: radial-gradient(circle at top, rgba(34, 197, 94, 0.15) 0%, rgba(11, 17, 32, 0.95) 70%);
            padding: 80px 20px 60px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }
        .badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid rgba(34, 197, 94, 0.4);
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }
        h1 { 
            font-size: 3.2rem; 
            font-weight: 800; 
            letter-spacing: 3px; 
            margin-bottom: 15px; 
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-desc { max-width: 620px; margin: 0 auto 35px; color: var(--text-muted); font-size: 1.1rem; }

        /* 連線控制台 */
        .connect-panel {
            max-width: 650px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #0f172a;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 0.95rem;
            border: 1px solid #1e293b;
        }
        .status-dot { 
            display: inline-block; width: 10px; height: 10px; border-radius: 50%; 
            background: #eab308; margin-right: 8px; animation: pulse 1.5s infinite;
        }
        .status-dot.online { background: var(--primary); box-shadow: 0 0 10px var(--primary); animation: none; }
        .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

        .btn {
            display: flex; align-items: center; justify-content: center;
            padding: 14px 20px; border-radius: 10px; font-weight: bold; font-size: 1.05rem;
            text-decoration: none; border: none; cursor: pointer; transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
        .btn:active { transform: translateY(0); }
        .btn-java { background: var(--primary); color: #052e16; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3); }
        .btn-discord { background: var(--discord); color: #fff; box-shadow: 0 4px 14px rgba(88, 101, 242, 0.3); }

        .toast {
            margin-top: 15px; padding: 12px; border-radius: 8px;
            background: rgba(34, 197, 94, 0.15); border: 1px solid var(--primary);
            color: #86efac; font-size: 0.92rem; display: none;
        }

        /* 內容區塊通用樣式 */
        section { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
        h2 { text-align: center; font-size: 1.9rem; margin-bottom: 35px; color: #f1f5f9; letter-spacing: 1px; }
        h2 span { color: var(--primary); }

        /* 伺服器特色卡片 */
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
        .card {
            background: var(--card-bg); padding: 28px; border-radius: 14px;
            border: 1px solid #334155; transition: 0.3s;
        }
        .card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .card-icon { font-size: 2.3rem; margin-bottom: 14px; }
        .card h3 { font-size: 1.25rem; margin-bottom: 10px; color: #fff; }
        .card p { color: var(--text-muted); font-size: 0.95rem; }

        /* 常用指令快捷表 */
        .cmd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .cmd-item {
            background: #131c31; padding: 16px 20px; border-radius: 10px;
            border: 1px solid #26334d; display: flex; flex-direction: column; gap: 6px;
        }
        .cmd-code { color: #38bdf8; font-family: Consolas, monospace; font-weight: bold; font-size: 1.05rem; }
        .cmd-desc { color: var(--text-muted); font-size: 0.9rem; }

        /* 規章區塊 */
        .rules-box { background: var(--card-bg); padding: 30px; border-radius: 14px; border: 1px solid #334155; }
        .rules-list { list-style: none; }
        .rules-list li { padding: 14px 0; border-bottom: 1px solid #334155; display: flex; align-items: center; }
        .rules-list li:last-child { border-bottom: none; }
        .rule-num {
            background: var(--primary); color: #052e16; font-weight: bold;
            width: 28px; height: 28px; border-radius: 6px; display: inline-flex;
            align-items: center; justify-content: center; margin-right: 15px; flex-shrink: 0;
        }

        footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid #1e293b; margin-top: 80px; }
    </style>
</head>
<body>

    <header>
        <div class="badge">✨ 支援 Java 最新版本</div>
        <h1>cn伺服器</h1>
        <p class="hero-desc">打造最純粹、穩定且充滿樂趣的生存冒險世界。無需安裝複雜模組，立即連線開啟你的專屬旅程！</p>

        <div class="connect-panel">
            <!-- 即時伺服器狀態顯示 -->
            <div class="status-bar">
                <div><span class="status-dot" id="status-dot"></span><span id="status-text">正在偵測伺服器狀態...</span></div>
                <div>連線位址：<strong style="color: #38bdf8;" id="display-ip">cn00.myvnc.com</strong></div>
            </div>

            <div class="btn-grid">
